<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1022" viewBox="0 0 1360 1022" role="img" aria-labelledby="title description">
<title id="title">OpenFun architecture</title>
<desc id="description">Configurable model providers generate content, behavior code, and assets managed by OpenFun. Godot loads them and continuously handles interaction, simulation, rendering, and world state. Player actions and world state feed back into generation. Creation defines epoch0; play generates subsequent updates. Maps and regions load as needed, while world state and player progress persist.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect id="openfun-architecture-001" x="0" y="0" width="1360" height="1022" fill="#ffffff" stroke="none" stroke-width="0"/>
<text id="openfun-architecture-002" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="34"><tspan x="40" y="60.375">OpenFun architecture</tspan></text>
<text id="openfun-architecture-003" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="21"><tspan x="40" y="100.75">Create epoch0. Generate new content and assets as people play.</tspan></text>
<rect id="openfun-architecture-004" x="40" y="156" width="882" height="372" fill="#f5f9fa" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-005" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="25"><tspan x="64" y="198.375">OpenFun</tspan></text>
<rect id="openfun-architecture-006" x="64" y="228" width="234" height="230" fill="#ffffff" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-007" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="22"><tspan x="84" y="268.625">Model providers</tspan></text>
<text id="openfun-architecture-008" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="84" y="309.875">Text + code</tspan><tspan x="84" y="334.875">Image + video</tspan><tspan x="84" y="359.875">Audio + 3D</tspan></text>
<text id="openfun-architecture-009" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="18"><tspan x="84" y="421.125">Cloud or local</tspan></text>
<rect id="openfun-architecture-010" x="420" y="214" width="474" height="116" fill="#ffffff" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-011" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="23"><tspan x="440" y="251.5">Content</tspan></text>
<text id="openfun-architecture-012" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="440" y="288.875">World, characters, story</tspan><tspan x="440" y="313.875">Rules + mechanism code</tspan></text>
<rect id="openfun-architecture-013" x="420" y="350" width="474" height="116" fill="#ffffff" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-014" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="23"><tspan x="440" y="387.5">Assets</tspan></text>
<text id="openfun-architecture-015" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="440" y="424.875">Images, animation, audio, 3D</tspan><tspan x="440" y="449.875">Composed into scenes, maps + regions</tspan></text>
<polyline id="openfun-architecture-016" points="310,340 358,340 358,272 408,272" fill="none" stroke="#8da4af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="openfun-architecture-017" points="358,340 358,408 408,408" fill="none" stroke="#8da4af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="openfun-architecture-018" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="18"><tspan x="330" y="505.125">Generate and edit in discrete epochs</tspan></text>
<text id="openfun-architecture-019" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="17"><tspan x="934" y="334.25">Prepare</tspan><tspan x="934" y="355.5">+ load</tspan></text>
<polyline id="openfun-architecture-020" points="934,385 998,385" fill="none" stroke="#246779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect id="openfun-architecture-021" x="1010" y="275" width="310" height="202" fill="#e9f3f3" stroke="#246779" stroke-width="1.8"/>
<text id="openfun-architecture-022" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="25"><tspan x="1032" y="316.375">Godot engine</tspan></text>
<text id="openfun-architecture-023" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="1032" y="358.875">Continuous play</tspan><tspan x="1032" y="383.875">Interaction + simulation</tspan><tspan x="1032" y="408.875">Rendering + world state</tspan></text>
<polyline id="openfun-architecture-024" points="1165,489 1165,576 180,576 180,540" fill="none" stroke="#246779" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="openfun-architecture-025" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="19"><tspan x="408" y="559.0">Player actions + world state inform what comes next</tspan></text>
<text id="openfun-architecture-026" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="26"><tspan x="40" y="656.375">World evolution</tspan></text>
<text id="openfun-architecture-027" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="19"><tspan x="40" y="690.0">Creation defines the initial world; play continues its evolution.</tspan></text>
<rect id="openfun-architecture-028" x="40" y="722" width="348" height="146" fill="#f5f9fa" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-029" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="23"><tspan x="60" y="762.5">Creation · epoch0</tspan></text>
<text id="openfun-architecture-030" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="60" y="804.875">Initial content + assets</tspan><tspan x="60" y="829.875">Rules + generation direction</tspan></text>
<rect id="openfun-architecture-031" x="506" y="722" width="348" height="146" fill="#f5f9fa" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-032" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="23"><tspan x="526" y="762.5">Play · epoch1</tspan></text>
<text id="openfun-architecture-033" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="526" y="804.875">New content + assets</tspan><tspan x="526" y="829.875">Based on the current world</tspan></text>
<rect id="openfun-architecture-034" x="974" y="722" width="348" height="146" fill="#f5f9fa" stroke="#c7d6dc" stroke-width="1.5"/>
<text id="openfun-architecture-035" fill="#18323e" font-family="Helvetica, Arial, sans-serif" font-size="23"><tspan x="994" y="762.5">Play · epoch2+</tspan></text>
<text id="openfun-architecture-036" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="994" y="804.875">Further generated updates</tspan><tspan x="994" y="829.875">Reuse what has not changed</tspan></text>
<polyline id="openfun-architecture-037" points="400,794 494,794" fill="none" stroke="#246779" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline id="openfun-architecture-038" points="866,794 962,794" fill="none" stroke="#246779" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="openfun-architecture-039" fill="#246779" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="40" y="916.875">Godot runs continuously as updates become ready.</tspan></text>
<polyline id="openfun-architecture-040" points="40,943 1322,943" fill="none" stroke="#246779" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="openfun-architecture-041" fill="#506873" font-family="Helvetica, Arial, sans-serif" font-size="18"><tspan x="40" y="989.125">Updates can be independent. Load regions as needed; persist the world and player progress.</tspan></text>
</svg>
